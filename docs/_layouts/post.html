---
layout: default
---

<div class="mb-1 text-muted">{{ page.date | date: "%-d %B %Y" }}</div>

<h2 class="pb-4 mb-4 border-bottom">{{ page.title }}</h2>

{{content}}

<!-- Tag Formatting -->
{% if page.tags %}
  <hr class="my-5">
  <div class="mb-3">
    <!-- <small class="text-secondary">tags:</small> -->
    {% for tag in page.tags %}
      <a href="/tags#{{ tag | slugify }}" class="badge rounded-pill bg-secondary text-decoration-none me-1">{{ tag }}</a>
    {% endfor %}
  </div>
{% endif %}
